name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Apply icon, splash, permissions, version
        run: python3 scripts/patch.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sync
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DailyLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyLog-apk
          path: android-app/DailyLog.apk

      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest DailyLog.apk \
            --title "Daily Log app (build ${{ github.run_number }})" \
            --notes "Download DailyLog.apk and install it on your Android phone." \
            --target "${{ github.sha }}"
